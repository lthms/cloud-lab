apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: raya-mediawiki
spec:
  interval: 5m
  url: https://github.com/lthms/raya-mediawiki
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mediawiki-prerequisites
spec:
  interval: 10m
  retryInterval: 1m
  path: ./shared
  targetNamespace: cloud-lab
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: raya-mediawiki
  decryption:
    provider: sops
