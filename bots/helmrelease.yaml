apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bots
spec:
  interval: 10m
  timeout: 20m
  releaseName: bots
  chartRef:
    kind: OCIRepository
    name: mediawiki
  values:
    id: bots
    title: Brains on the shelf
    hostname: bots.xmu.mx
    database:
      name: mediawiki
    appSecret: mediawiki-app
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mediawiki
spec:
  interval: 10m
  url: oci://ghcr.io/lthms/raya-mediawiki/charts/mediawiki
  ref:
    # 0.0.0-dev.15.1.g153f980db8b6
    digest: sha256:2ec8af5501d6845fe8d83d50f47cbcac78d46da09ea3042f8eda131271e5a2ed
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
