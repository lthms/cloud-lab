apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bots
spec:
  interval: 10m
  timeout: 20m
  releaseName: bots
  chartRef:
    kind: OCIRepository
    name: mediawiki
  values:
    id: bots
    title: Brains on the shelf
    hostname: bots.xmu.mx
    database:
      name: mediawiki
    appSecret: mediawiki-app
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mediawiki
spec:
  interval: 10m
  url: oci://ghcr.io/lthms/raya-mediawiki/charts/mediawiki
  ref:
    # 0.0.0-dev.10.1.gcb9891c6e9d3
    digest: sha256:9bc60a364e1e48684ada45023b9f02c68e2432c7b3a28e09c5574040dd3af7e5
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
