---
# The site is a garage bucket
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soap-coffee
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: cloud-lab-soap-coffee-root@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - soap.coffee
      secretName: soap-coffee-tls
  rules:
    - host: soap.coffee
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  name: web

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: soap-coffee-root
spec:
  redirectRegex:
    regex: ^https://soap\.coffee/?$
    replacement: https://soap.coffee/~lthms/
    permanent: false
