---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soap-coffee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soap-coffee
  template:
    metadata:
      labels:
        app: soap-coffee
    spec:
      containers:
        - name: soap-coffee
          # `live` is what the site's makefile pushes to, and it moves: the
          # digest behind it changes without this manifest changing.
          image: ams.vultrcr.com/lthms/www/soap.coffee:live
          imagePullPolicy: Always
          env:
            - name: SOAP_COFFEE_INTERFACE
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 8901
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          # The server holds the whole site in its own binary and talks to
          # nothing else, so a served root page is all "healthy" can mean here.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
