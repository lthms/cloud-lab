---
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  selector:
    app: garage
  ports:
    - port: 3900
      targetPort: s3
      name: s3
    - port: 3902
      targetPort: web
      name: web
    # Only reachable from inside the namespace: the bootstrap Job talks to it,
    # and nothing else should.
    - port: 3903
      targetPort: admin
      name: admin

